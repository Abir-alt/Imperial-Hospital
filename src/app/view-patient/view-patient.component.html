<!-- Patient Details Table -->
<div class="container mt-5">
  <h3 class="text-center text-primary mb-4 fw-bold">
    <i class="bi bi-person-vcard"></i> Patient Information
  </h3>

  <div class="table-responsive">
    <table class="table table-bordered table-striped table-hover text-center">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Blood Group</th>
          <th>Prescription</th>
          <th>Dosage</th>
          <th>Urgency</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{{ patient.id }}</td>
          <td>{{ patient.name }}</td>
          <td>{{ patient.age }}</td>
          <td>{{ patient.blood }}</td>
          <td>{{ patient.prescription }}</td>
          <td>{{ patient.does }}</td>
          <td>{{ patient.urgency }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

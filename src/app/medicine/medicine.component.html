<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-warning" href="#">
      <i class="bi bi-hospital"></i> Imperial Hospital
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item me-2">
          <a class="nav-link text-white" routerLink="/docdash">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/create-medicine">
            <i class="bi bi-plus-circle"></i> Add Medicine
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Container -->
<div class="container mt-5">

  <!-- Divider -->
  <hr class="border border-primary border-2 opacity-50">

  <!-- Page Heading -->
  <h2 class="text-center text-primary mb-4 fw-bold">
    <i class="bi bi-clipboard2-pulse-fill"></i> Welcome to Medicine List
  </h2>

  <!-- Marquee Welcome -->
  <div class="mb-4">
    <marquee behavior="scroll" direction="left" scrollamount="6" class="text-success fw-semibold fs-5">
      🏥 Welcome to the Medicine List of Imperial Hospital. Monitor and manage your medical inventory efficiently!
    </marquee>
  </div>

  <!-- Medicine Table -->
  <div class="mt-4">
    <h4 class="text-center text-muted mb-3">📦 Current Medicine Stock</h4>
    <div class="table-responsive shadow-sm rounded">
      <table class="table table-striped table-bordered table-hover align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th>ID</th>
            <th>Drug Name</th>
            <th>Stock</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let medicine of medicines" class="text-center">
            <td>{{ medicine.id }}</td>
            <td>{{ medicine.drugName }}</td>
            <td>{{ medicine.stock }}</td>
            <td>
              <button class="btn btn-sm btn-primary me-2" (click)="update(medicine.id)">
                <i class="bi bi-pencil-square"></i> Update
              </button>
              <button class="btn btn-sm btn-danger" (click)="delete(medicine.id)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>


<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Imperial Hospital</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" routerLink="/medicine">Medicine List</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">Add New Medicine</h2>
  
    <form (ngSubmit)="onSubmit()">
      <div class="form-group mb-3">
        <label for="drugName">Drug Name</label>
        <input
          type="text"
          class="form-control"
          id="drugName"
          name="drugName"
          placeholder="Enter your drug name"
          [(ngModel)]="medicine.drugName"
        />
      </div>
  
      <div class="form-group mb-3">
        <label for="stock">Stock</label>
        <input
          type="text"
          class="form-control"
          id="stock"
          name="stock"
          placeholder="Enter stock"
          [(ngModel)]="medicine.stock"
        />
      </div>
  
      <button type="submit" class="btn btn-success">Submit</button>
    </form>
  
  </div>
